[project]
name = "siemens-wiki-common"
version = "0.1.0"
description = "Shared Confluence ingestion + Azure AI Search logic for the Siemens Wiki MCP project"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "azure-search-documents>=11.5.1",
    "azure-core>=1.30",
    "openai>=1.14",
    "mcp>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.setuptools.packages.find]
where = ["shared"]

[tool.pytest.ini_options]
pythonpath = ["shared", "mcp_server", "ingestion"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
